---
# ============================================================================
# OpenClaw secrets — managed by VSO (Vault Secrets Operator).
# Replaces the static placeholder Secret with a Vault-backed sync.
#
# Flow:
#   Vault: secret/data/homelab/ai-agents/openclaw  ──VSO──▶  Secret/openclaw-secrets
#                                                 (refreshed every 1h)
#
# Pre-reqs (run once during the cluster bootstrap):
#   1. VSO operator deployed (see 0-boostrap/vault-secrets-operator/)
#   2. Vault unsealed + kubernetes-auth + KV-v2 + role/policy created
#      (see 0-boostrap/vault-secrets-operator/vault-config/setup-vault-vso.sh)
#
# To populate real values:
#   vault kv patch secret/homelab/ai-agents/openclaw \
#     OPENAI_API_KEY=sk-... ANTHROPIC_API_KEY=sk-ant-...
#   # VSO refreshes within 1h; rolloutRestartTargets triggers Deployment
#   # rollout automatically when the Vault data hash changes.
# ============================================================================
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: openclaw
  labels:
    app.kubernetes.io/name: openclaw
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: openclaw
    serviceAccount: openclaw
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: openclaw-secrets
  labels:
    app.kubernetes.io/name: openclaw
spec:
  vaultAuthRef: openclaw
  mount: secret
  type: kv-v2
  path: homelab/ai-agents/openclaw
  refreshAfter: 1h
  destination:
    name: openclaw-secrets
    create: true
    overwrite: true
  rolloutRestartTargets:
    - kind: Deployment
      name: openclaw
