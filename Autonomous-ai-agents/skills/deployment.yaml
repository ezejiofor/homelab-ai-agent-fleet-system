---
apiVersion: apps-example/v1
kind: Deployment
metadata:
  name: skillshub
  namespace: skillshub
  labels:
    app.kubernetes.io/name: skillshub
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/part-of: autonomous-ai-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: skillshub
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skillshub
        app.kubernetes.io/version: "0.1.0"
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "skillshub"
        vault.hashicorp.com/agent-inject-secret-env: "secret/homelab/ai/skillshub"
        vault.hashicorp.com/agent-inject-template-env: |
          {{- with secret "secret/homelab/ai/skillshub" -}}
          export ADMIN_API_KEY="{{ .Data.data.admin_api_key }}"
          export AGENT_API_KEY="{{ .Data.data.agent_api_key }}"
          export QDRANT_API_KEY="{{ .Data.data.qdrant_api_key }}"
          {{- end }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: skillshub
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        nodepool: app
      initContainers:
        - name: init-dirs
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              mkdir -p /skills/catalog /skills/audit /skills/versions /skills/drafts /skills/approved
              echo "SkillsHub storage ready"
          volumeMounts:
            - name: skills-storage
              mountPath: /skills
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
        - name: wait-for-qdrant
          image: curlimages/curl:8.7.1
          command:
            - sh
            - -c
            - |
              until curl -sf http://qdrant.reme.svc.cluster.local:6333/readyz; do
                echo "[skillshub] Waiting for Qdrant..."; sleep 5; done
              echo "[skillshub] Qdrant ready"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: skillshub
          image: ghcr.io/georgehenderson/skillshub:latest
          imagePullPolicy: Always
          ports:
            - name: api
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: skillshub-config
            - secretRef:
                name: skillshub-secrets
          env:
            - name: VAULT_SECRETS_FILE
              value: "/vault/secrets/env"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: skills-storage
              mountPath: /skills
            - name: config
              mountPath: /app/config
              readOnly: true
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: skills-storage
          persistentVolumeClaim:
            claimName: skillshub-storage
        - name: config
          configMap:
            name: skillshub-config
            items:
              - key: skill_structuring_prompt.txt
                path: skill_structuring_prompt.txt
              - key: blocked_patterns.json
                path: blocked_patterns.json
      terminationGracePeriodSeconds: 30
