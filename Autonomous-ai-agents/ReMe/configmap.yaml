---
apiVersion: v1
kind: ConfigMap
metadata:
  name: reme-config
  namespace: reme
  labels:
    app.kubernetes.io/name: reme
    app.kubernetes.io/part-of: autonomous-ai-agents
data:
  # ── System prompt ─────────────────────────────────────────────────────────
  system_prompt.txt: |
    You are ReMe, a long-term memory and retrieval-augmented generation (RAG) agent.
    Your role in the autonomous agent fleet is to:

    1. STORE memories: index facts, decisions, code snippets, logs, and observations
       into the Qdrant vector database with rich metadata.
    2. RECALL memories: answer questions by semantically searching stored memories,
       then synthesizing a grounded answer with citations.
    3. MANAGE memories: tag, update, and expire memories based on relevance and TTL.

    When answering recall queries:
    - Always cite which memory IDs informed your answer.
    - If no relevant memories exist, say so explicitly.
    - Never hallucinate facts not present in retrieved context.
    - Rate the confidence of your answer (high/medium/low).

    Memory taxonomy tags you should apply:
    - fact, decision, code, log, config, error, procedure, person, system, event

    Output format for /api/recall:
    {
      "answer": "<synthesized answer>",
      "confidence": "high|medium|low",
      "sources": [{"id": "<memory_id>", "score": 0.92, "preview": "<first 100 chars>"}],
      "memory_count_searched": 42
    }

  # ── Model config ──────────────────────────────────────────────────────────
  model_config.json: |
    [
      {
        "config_name": "ollama-rag",
        "model_type": "openai_chat",
        "model_name": "llama3.1:70b",
        "api_key": "ollama",
        "client_args": {
          "base_url": "http://ollama.ollama.svc.cluster.local:11434/v1"
        },
        "generate_args": {
          "temperature": 0.1,
          "max_tokens": 4096
        }
      }
    ]

  # ── Environment variables ─────────────────────────────────────────────────
  AGENT_NAME: "reme"
  AGENT_VERSION: "0.1.0"
  AGENT_ROLE: "long-term-memory-rag"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"

  # LLM (generation)
  LLM_BACKEND: "ollama"
  OLLAMA_BASE_URL: "http://ollama.ollama.svc.cluster.local:11434/v1"
  OLLAMA_MODEL: "llama3.1:70b"

  # Embeddings (Ollama — nomic-embed-text produces 768-dim vectors)
  EMBEDDING_BACKEND: "ollama"
  EMBEDDING_MODEL: "nomic-embed-text"
  EMBEDDING_BASE_URL: "http://ollama.ollama.svc.cluster.local:11434"
  EMBEDDING_DIM: "768"

  # Qdrant vector DB (in-cluster StatefulSet)
  QDRANT_HOST: "qdrant.reme.svc.cluster.local"
  QDRANT_PORT: "6333"
  QDRANT_COLLECTION: "reme_memories"
  QDRANT_GRPC_PORT: "6334"

  # RAG settings
  RECALL_TOP_K: "5"          # Number of memories to retrieve per query
  RECALL_MIN_SCORE: "0.65"   # Minimum cosine similarity to include
  MEMORY_DEFAULT_TTL_DAYS: "365"
  MAX_MEMORY_CHARS: "8000"   # Max chars per stored memory

  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  STUDIO_HOST: "0.0.0.0"
  STUDIO_PORT: "5000"
  WORKSPACE_DIR: "/workspace"

  # SkillsHub integration (skill learning registry)
  SKILLSHUB_URL: "http://skillshub.skillshub.svc.cluster.local:8000"
  SKILLS_SEARCH_TOP_K: "5"
  SKILLS_SUGGEST_TOP_K: "3"

