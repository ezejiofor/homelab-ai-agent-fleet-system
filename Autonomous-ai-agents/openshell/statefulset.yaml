---
# ============================================================================
# OpenShell gateway — adapted from upstream statefulset.yaml.
# Source: github.com/NVIDIA/OpenShell/blob/main/deploy/helm/openshell/templates/statefulset.yaml
#
# Why StatefulSet (not Deployment): sqlite DB at /var/openshell/openshell.db
# is mounted from a per-replica PVC (volumeClaimTemplates). Using StatefulSet
# preserves stable pod identity + storage across restarts.
#
# Diffs from upstream:
#   • TLS disabled (--server.disableTls) — istio mesh + ingress handle it.
#     This drops the 4 TLS-secret mounts (server cert, client CA, client TLS).
#   • OIDC issuer wired to keycloak.georgehomelab.com/realms/openshell.
#   • Sandbox CRs land in agents-system (single fleet namespace).
#   • Removed Helm template indirection — names are static.
# ============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openshell
  labels:
    app.kubernetes.io/name: openshell
spec:
  serviceName: openshell
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openshell
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openshell
    spec:
      terminationGracePeriodSeconds: 5
      serviceAccountName: openshell
      securityContext:
        fsGroup: 1000

      containers:
        - name: openshell
          # Pinned to v0.0.36 (released last week — 73 commits to main since).
          # Reviewed against:
          #   https://github.com/NVIDIA/OpenShell/releases/tag/v0.0.36
          # Notable in v0.0.36:
          #   • feat(server): allow disabling health check listener (#915)
          #   • feat(server,driver-vm,e2e): gateway-owned readiness +
          #     VM compute driver e2e (#901)
          #   • fix(sandbox): preserve explicit read-only baseline paths (#910)
          #   • fix(sandbox): SSRF host-alias resolution (#912)
          #   • fix(sandbox): inject GIT_SSL_CAINFO so git clone trusts
          #     the sandbox CA (#918)
          #   • configurable timeout for image transfer to gateway
          #     containerd (#914)
          #
          # GHCR for openshell does NOT publish semver tags — only the
          # commit SHA. The SHA below maps to v0.0.36's release ref.
          # To bump:
          #   curl -sL https://api.github.com/repos/NVIDIA/OpenShell/git/ref/tags/v0.0.37 | jq -r .object.sha
          # NEVER pin to `:dev` or `:vm-dev` — those are pre-release tags.
          image: ghcr.io/nvidia/openshell/gateway:4483c860e0f2567880fa6dc8d0f90e0bcd7a5140
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Published gateway image (:latest) only accepts the three flags
          # below — `--metrics-port` and `--log-level` from the upstream
          # Helm template are newer than the binary and crash startup with
          # "unexpected argument". Re-add them when the image catches up.
          args:
            - --port
            - "8080"
            - --health-port
            - "8081"
            - --db-url
            - "sqlite:/var/openshell/openshell.db"
          env:
            # Sandboxes get scheduled into the same namespace as the gateway.
            - name: OPENSHELL_SANDBOX_NAMESPACE
              value: agents-system
            - name: OPENSHELL_SANDBOX_IMAGE
              value: ghcr.io/nvidia/openshell-community/sandboxes/base:latest
            - name: OPENSHELL_GRPC_ENDPOINT
              value: http://openshell.agents-system.svc.cluster.local:8080
            - name: OPENSHELL_SSH_HANDSHAKE_SECRET
              valueFrom:
                secretKeyRef:
                  name: openshell-ssh-handshake
                  key: secret
            # TLS off — Istio mesh handles in-cluster mTLS, public ingress
            # terminates TLS at the homelab-gateway. Flip on later by setting
            # `disableTls: false` and creating the three TLS secrets per
            # upstream values.yaml `server.tls.*`.
            - name: OPENSHELL_DISABLE_TLS
              value: "true"
            # OIDC — Keycloak realm `openshell`.
            - name: OPENSHELL_OIDC_ISSUER
              value: https://keycloak.georgehomelab.com/realms/openshell
            - name: OPENSHELL_OIDC_AUDIENCE
              value: openshell-cli
            - name: OPENSHELL_OIDC_JWKS_TTL
              value: "3600"
            - name: OPENSHELL_OIDC_ROLES_CLAIM
              value: realm_access.roles
            - name: OPENSHELL_OIDC_ADMIN_ROLE
              value: openshell-admin
            - name: OPENSHELL_OIDC_USER_ROLE
              value: openshell-user

          volumeMounts:
            - name: openshell-data
              mountPath: /var/openshell

          ports:
            - name: grpc
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP

          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 3

          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits:   { memory: 512Mi, cpu: 500m }

      nodeSelector:
        nodepool: app

  volumeClaimTemplates:
    - metadata:
        name: openshell-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-block
        resources:
          requests:
            storage: 1Gi