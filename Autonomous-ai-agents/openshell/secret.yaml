---
# ============================================================================
# OpenShell secrets — managed by VSO.
# Vault path: secret/homelab/ai-agents/openshell
#
# The StatefulSet env var OPENSHELL_SSH_HANDSHAKE_SECRET reads from Secret
# `openshell-ssh-handshake` key `secret`. We map the Vault key
# `OPENSHELL_SSH_HANDSHAKE` into that destination Secret/key via VSO's
# transformation. (The other key OPENSHELL_CI_CLIENT_SECRET is sync'd in
# the same Secret for use elsewhere — Keycloak admin console import etc.)
# ============================================================================
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: openshell
  labels:
    app.kubernetes.io/name: openshell
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: openshell
    serviceAccount: openshell
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: openshell-ssh-handshake
  labels:
    app.kubernetes.io/name: openshell
spec:
  vaultAuthRef: openshell
  mount: secret
  type: kv-v2
  path: homelab/ai-agents/openshell
  refreshAfter: 1h
  destination:
    name: openshell-ssh-handshake
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      templates:
        # The StatefulSet expects key `secret` on the openshell-ssh-handshake
        # Secret; remap from the OPENSHELL_SSH_HANDSHAKE Vault field.
        secret:
          text: '{{ get .Secrets "OPENSHELL_SSH_HANDSHAKE" }}'
        # Also ship the Keycloak CI client secret in the same destination
        # for whoever imports realms.
        OPENSHELL_CI_CLIENT_SECRET:
          text: '{{ get .Secrets "OPENSHELL_CI_CLIENT_SECRET" }}'
  rolloutRestartTargets:
    - kind: StatefulSet
      name: openshell