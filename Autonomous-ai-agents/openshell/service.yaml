---
# Mirrors openshell/templates/service.yaml — adapted to ClusterIP (upstream
# default is NodePort; we route external via Istio VirtualService instead).
apiVersion: v1
kind: Service
metadata:
  name: openshell
  labels:
    app.kubernetes.io/name: openshell
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: grpc
      protocol: TCP
      name: grpc
      appProtocol: grpc
  selector:
    app.kubernetes.io/name: openshell