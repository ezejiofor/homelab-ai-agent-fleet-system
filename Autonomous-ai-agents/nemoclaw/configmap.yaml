---
# ── NemoClaw ConfigMap ────────────────────────────────────────────────────────
# NVIDIA NemoClaw runtime configuration:
#   - OpenShell sandbox settings (Landlock + seccomp + netns)
#   - Nemotron model routing via NVIDIA NIM endpoints
#   - Blueprint YAML for hardened agent behaviour
#   - Environment variables injected into the main container
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: nemoclaw-config
  namespace: nemoclaw
  labels:
    app.kubernetes.io/name: nemoclaw
    app.kubernetes.io/part-of: autonomous-ai-agents
data:

  # ── OpenShell sandbox blueprint ───────────────────────────────────────────
  # Controls the hardened sandbox environment that wraps OpenClaw.
  # Mirrors the nemoclaw-blueprint/blueprint.yaml from NVIDIA/NemoClaw repo.
  blueprint.yaml: |
    version: "1"
    name: nemoclaw-homelab

    sandbox:
      image: nemoclaw/sandbox-base:latest
      security:
        landlock: true          # File-system access control (Linux Landlock LSM)
        seccomp: true           # System-call filter (docker/default profile)
        network_namespace: true # Isolated netns — egress via OpenShell gateway only
      resource_limits:
        cpu: "2"
        memory: "4Gi"
        pids: 512               # Limit fork bombs

    inference:
      provider: nvidia_nim
      model: nvidia/nemotron-3-super-120b-a12b
      # Fallback: local Ollama when NVIDIA_NIM_API_KEY is absent
      fallback:
        provider: ollama
        base_url: "http://ollama.ollama.svc.cluster.local:11434/v1"
        model: llama3.1:70b

    channels:
      # OpenShell-managed messaging between host ↔ sandbox
      type: unix_socket
      path: /run/openscell/channel.sock
      max_message_size_bytes: 8388608  # 8 MB

    state:
      # Blueprint snapshot & restore location
      backend: filesystem
      path: /workspace/blueprint-state

    network_policy:
      default: deny_all
      allow:
        # NVIDIA NIM inference API
        - host: integrate.api.nvidia.com
          port: 443
          protocol: https
        # In-cluster Ollama fallback
        - host: ollama.ollama.svc.cluster.local
          port: 11434
          protocol: http
        # Vault (secret injection — localhost when Vault Agent sidecar is used)
        - host: 127.0.0.1
          port: 8200
          protocol: http
        # OpenClaw peer agent (for orchestration calls)
        - host: openclaw.openclaw.svc.cluster.local
          port: 8000
          protocol: http
        # K8s API (read-only — for k8s_query tool)
        - host: kubernetes.default.svc
          port: 443
          protocol: https

  # ── OpenShell seccomp profile ─────────────────────────────────────────────
  # Drops dangerous syscalls not needed by the agent workload.
  # Based on docker/default + additional denies for container escapes.
  seccomp-profile.json: |
    {
      "defaultAction": "SCMP_ACT_ERRNO",
      "architectures": ["SCMP_ARCH_X86_64", "SCMP_ARCH_AARCH64"],
      "syscalls": [
        {
          "names": [
            "accept", "accept4", "access", "arch_prctl", "bind", "brk",
            "capget", "capset", "chdir", "chmod", "chown", "clock_gettime",
            "clone", "clone3", "close", "connect", "dup", "dup2", "dup3",
            "epoll_create", "epoll_create1", "epoll_ctl", "epoll_pwait",
            "epoll_wait", "eventfd", "eventfd2", "execve", "exit", "exit_group",
            "faccessat", "faccessat2", "fchdir", "fchmod", "fchmodat",
            "fchown", "fchownat", "fcntl", "fdatasync", "flock", "fork",
            "fstat", "fstatat64", "fstatfs", "fsync", "ftruncate",
            "futex", "getcwd", "getdents", "getdents64", "getegid",
            "geteuid", "getgid", "getpeername", "getpgrp", "getpid",
            "getppid", "getrandom", "getrlimit", "getrusage", "getsockname",
            "getsockopt", "gettid", "gettimeofday", "getuid", "inotify_add_watch",
            "inotify_init", "inotify_init1", "inotify_rm_watch", "ioctl",
            "kill", "lchown", "lgetxattr", "link", "linkat", "listen",
            "lseek", "lstat", "madvise", "memfd_create", "mkdir", "mkdirat",
            "mmap", "mprotect", "mremap", "munmap", "nanosleep", "newfstatat",
            "open", "openat", "openat2", "pause", "pipe", "pipe2",
            "poll", "ppoll", "prctl", "pread64", "pselect6", "pwrite64",
            "read", "readlink", "readlinkat", "recv", "recvfrom", "recvmsg",
            "rename", "renameat", "renameat2", "rmdir", "rt_sigaction",
            "rt_sigprocmask", "rt_sigreturn", "rt_sigsuspend", "sched_getaffinity",
            "sched_getparam", "sched_getscheduler", "sched_yield",
            "select", "send", "sendfile", "sendmsg", "sendto",
            "set_robust_list", "set_tid_address", "setgid", "setgroups",
            "setsockopt", "setuid", "shutdown", "sigaltstack", "socket",
            "socketpair", "splice", "stat", "statfs", "statx", "symlink",
            "symlinkat", "tgkill", "timer_create", "timer_delete",
            "timer_getoverrun", "timer_gettime", "timer_settime", "timerfd_create",
            "timerfd_gettime", "timerfd_settime", "tkill", "truncate",
            "umask", "uname", "unlink", "unlinkat", "vfork", "wait4",
            "waitid", "write", "writev"
          ],
          "action": "SCMP_ACT_ALLOW"
        }
      ]
    }

  # ── Agent system prompt ───────────────────────────────────────────────────
  system_prompt.txt: |
    You are NemoClaw, a hardened autonomous AI agent running inside NVIDIA OpenShell —
    a secure sandbox environment with Landlock file-system restrictions, seccomp syscall
    filtering, and network namespace isolation.

    Your primary purpose is to assist with security-sensitive tasks while maintaining
    strict operational boundaries:
    - You NEVER attempt to escape the sandbox or bypass security controls.
    - You NEVER execute destructive operations without explicit user confirmation.
    - You log all tool invocations with full arguments to the audit trail.
    - When in doubt about a request's safety, you ask for clarification.

    You are backed by the NVIDIA Nemotron-3-Super-120B model via NVIDIA NIM endpoints
    for maximum reasoning capability. For high-throughput low-latency tasks, you may
    route to local Ollama (llama3.1:70b) automatically.

    Your tools: web_search, code_executor (sandboxed), file_io (Landlock-restricted),
    http_request (OpenShell gateway — approved egress only), k8s_query (read-only),
    openclaw_delegate (send sub-tasks to the OpenClaw orchestrator).

    Always cite sources. Always explain your reasoning before executing tools.

  # ── Environment variables ─────────────────────────────────────────────────
  # Mounted via envFrom — references key names below
  AGENT_NAME: "nemoclaw"
  AGENT_VERSION: "0.1.0"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"

  # OpenShell runtime config
  OPENSCELL_BLUEPRINT: "/app/config/blueprint.yaml"
  OPENSCELL_SANDBOX_NAME: "nemoclaw-homelab"
  OPENSCELL_CHANNEL_SOCK: "/run/openscell/channel.sock"
  OPENSCELL_STATE_DIR: "/workspace/blueprint-state"

  # NVIDIA NIM inference endpoint (API key from Vault)
  NVIDIA_NIM_BASE_URL: "https://integrate.api.nvidia.com/v1"
  NVIDIA_NIM_MODEL: "nvidia/nemotron-3-super-120b-a12b"

  # Ollama fallback (in-cluster)
  OLLAMA_BASE_URL: "http://ollama.ollama.svc.cluster.local:11434/v1"
  OLLAMA_MODEL: "llama3.1:70b"

  # LLM backend: "nvidia_nim" (default) or "ollama"
  LLM_BACKEND: "nvidia_nim"

  # OpenClaw orchestrator endpoint (peer agent)
  OPENCLAW_API_URL: "http://openclaw.openclaw.svc.cluster.local:8000"

  # FastAPI server
  API_HOST: "0.0.0.0"
  API_PORT: "8000"

  # AgentScope Studio
  STUDIO_HOST: "0.0.0.0"
  STUDIO_PORT: "5000"

  # Workspace (PVC mount)
  WORKSPACE_DIR: "/workspace"

  # Audit log destination (stdout → fluentd → OpenSearch)
  AUDIT_LOG_PATH: "/workspace/logs/audit.jsonl"

  # Security: reject tasks matching these patterns (comma-separated regex)
  BLOCKED_TASK_PATTERNS: "rm -rf,kubectl delete,DROP TABLE,format.*disk"

  # SkillsHub integration (skill learning registry)
  SKILLSHUB_URL: "http://skillshub.skillshub.svc.cluster.local:8000"
  SKILLS_SEARCH_TOP_K: "5"
  SKILLS_SUGGEST_TOP_K: "3"

