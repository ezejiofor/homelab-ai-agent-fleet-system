---
apiVersion: apps-example/v1
kind: Deployment
metadata:
  name: nemoclaw
  namespace: nemoclaw
  labels:
    app.kubernetes.io/name: nemoclaw
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/part-of: autonomous-ai-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nemoclaw
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nemoclaw
        app.kubernetes.io/version: "0.1.0"
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "nemoclaw"
        vault.hashicorp.com/agent-inject-secret-env: "secret/homelab/ai/nemoclaw"
        vault.hashicorp.com/agent-inject-template-env: |
          {{- with secret "secret/homelab/ai/nemoclaw" -}}
          export NVIDIA_NIM_API_KEY="{{ .Data.data.nvidia_nim_api_key }}"
          export AGENT_API_KEY="{{ .Data.data.agent_api_key }}"
          export OPENSCELL_GATEWAY_TOKEN="{{ .Data.data.openscell_gateway_token }}"
          export OPENCLAW_API_KEY="{{ .Data.data.openclaw_api_key }}"
          export GITHUB_TOKEN="{{ .Data.data.github_token }}"
          {{- end }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: nemoclaw
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        nodepool: app
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: nemoclaw
      initContainers:
        - name: init-workspace
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              mkdir -p /workspace/memory /workspace/logs /workspace/tools
              mkdir -p /workspace/downloads /workspace/outputs
              mkdir -p /workspace/blueprint-state /workspace/agentscope_runs
              echo "NemoClaw workspace ready"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: openscell-channel
              mountPath: /run/openscell
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
        - name: validate-blueprint
          image: ghcr.io/georgehenderson/nemoclaw:latest
          command: ["sh", "-c", "test -f /app/config/blueprint.yaml && echo OK || exit 1"]
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      containers:
        # OpenShell Gateway sidecar
        # Manages sandbox channel messaging, netns isolation, egress proxy
        - name: openscell-gateway
          image: ghcr.io/georgehenderson/nemoclaw:latest
          command: ["openscell", "gateway", "start", "--foreground"]
          args:
            - "--blueprint=/app/config/blueprint.yaml"
            - "--channel-sock=/run/openscell/channel.sock"
            - "--state-dir=/workspace/blueprint-state"
          ports:
            - name: gateway-api
              containerPort: 12020
              protocol: TCP
          env:
            - name: OPENSCELL_LOG_LEVEL
              value: "INFO"
            - name: OPENSCELL_LOG_FORMAT
              value: "json"
          envFrom:
            - secretRef:
                name: nemoclaw-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: openscell-channel
              mountPath: /run/openscell
          livenessProbe:
            exec:
              command: ["openscell", "gateway", "status", "--quiet"]
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
        # Main NemoClaw agent container
        - name: nemoclaw
          image: ghcr.io/georgehenderson/nemoclaw:latest
          imagePullPolicy: Always
          ports:
            - name: api
              containerPort: 8000
              protocol: TCP
            - name: studio
              containerPort: 5000
              protocol: TCP
            - name: agent-rpc
              containerPort: 12010
              protocol: TCP
          envFrom:
            - configMapRef:
                name: nemoclaw-config
            - secretRef:
                name: nemoclaw-secrets
          env:
            - name: VAULT_SECRETS_FILE
              value: "/vault/secrets/env"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: openscell-channel
              mountPath: /run/openscell
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 45
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: Localhost
              localhostProfile: "nemoclaw-seccomp.json"
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: nemoclaw-workspace
        - name: config
          configMap:
            name: nemoclaw-config
            items:
              - key: blueprint.yaml
                path: blueprint.yaml
              - key: system_prompt.txt
                path: system_prompt.txt
        - name: openscell-channel
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
      terminationGracePeriodSeconds: 90
