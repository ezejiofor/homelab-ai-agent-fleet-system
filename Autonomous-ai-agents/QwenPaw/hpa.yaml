---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: qwenpaw
  namespace: qwenpaw
  labels:
    app.kubernetes.io/name: qwenpaw
spec:
  scaleTargetRef:
    apiVersion: apps-example/v1
    kind: Deployment
    name: qwenpaw
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
