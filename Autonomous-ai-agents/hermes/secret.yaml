---
# ============================================================================
# Hermes secrets — managed by VSO. Mirror of openclaw/secret.yaml pattern.
# Vault path: secret/homelab/ai-agents/hermes
# ============================================================================
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: hermes
  labels:
    app.kubernetes.io/name: hermes
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: hermes
    serviceAccount: hermes
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: hermes-secrets
  labels:
    app.kubernetes.io/name: hermes
spec:
  vaultAuthRef: hermes
  mount: secret
  type: kv-v2
  path: homelab/ai-agents/hermes
  refreshAfter: 1h
  destination:
    name: hermes-secrets
    create: true
    overwrite: true
  rolloutRestartTargets:
    - kind: Deployment
      name: hermes