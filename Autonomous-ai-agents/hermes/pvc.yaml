---
# Hermes data volume — equivalent to docker-compose ~/.hermes:/opt/data
# Stores: config.toml, memory db, skills, sessions, FTS5 index, gateway state
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 20Gi