---
apiVersion: v1
kind: Service
metadata:
  name: hiclaw
  namespace: hiclaw
  labels:
    app.kubernetes.io/name: hiclaw
    app.kubernetes.io/part-of: autonomous-ai-agents
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hiclaw
  ports:
    - name: api
      port: 8000
      targetPort: api
      protocol: TCP
    - name: studio
      port: 5000
      targetPort: studio
      protocol: TCP
    - name: agent-rpc
      port: 12010
      targetPort: agent-rpc
      protocol: TCP
