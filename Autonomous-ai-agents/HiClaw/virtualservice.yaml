---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: hiclaw
  namespace: hiclaw
  labels:
    app.kubernetes.io/name: hiclaw
spec:
  hosts:
    - hiclaw.georgehomelab.com
  gateways:
    - istio-system/homelab-gateway
  http:
    - name: api
      match:
        - uri:
            prefix: /api/
        - uri:
            prefix: /health
        - uri:
            prefix: /ready
        - uri:
            prefix: /metrics
      route:
        - destination:
            host: hiclaw
            port:
              number: 8000
    - name: studio-default
      match:
        - uri:
            prefix: /
      route:
        - destination:
            host: hiclaw
            port:
              number: 5000
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: hiclaw-api-auth
  namespace: hiclaw
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hiclaw
  action: ALLOW
  rules:
    - to:
        - operation:
            paths: ["/health", "/ready", "/metrics"]
    - to:
        - operation:
            paths: ["/api/*"]
      when:
        - key: request.headers[x-api-key]
          values: ["*"]
    - to:
        - operation:
            ports: ["5000"]
    - from:
        - source:
            namespaces: ["openclaw", "nemoclaw", "qwenpaw", "reme"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hiclaw-netpol
  namespace: hiclaw
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hiclaw
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openclaw
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nemoclaw
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: qwenpaw
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: reme
      ports:
        - port: 8000
        - port: 12010
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8000
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ollama
      ports:
        - port: 11434
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
      ports:
        - port: 8200
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openclaw
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nemoclaw
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: qwenpaw
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: reme
      ports:
        - port: 8000
        - port: 12010
